<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To-Do List</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                font-family: system-ui, sans-serif;
                max-width: 600px;
                margin: 2rem auto;
                padding: 0 1rem;
                color: #222;
            }

            h1 {
                margin-bottom: 1.5rem;
            }

            .controls {
                display: flex;
                gap: 0.5rem;
                margin-bottom: 1rem;
            }

            .controls input[type="text"] {
                flex: 1;
                padding: 0.5rem 0.75rem;
                border: 1px solid #ccc;
                border-radius: 4px;
            }

            #search {
                width: 100%;
                padding: 0.5rem 0.75rem;
                border: 1px solid #ccc;
                border-radius: 4px;
                margin-bottom: 1rem;
            }

            button,
            input[type="submit"] {
                padding: 0.5rem 0.75rem;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                background: #2563eb;
                color: #fff;
            }

            button:disabled,
            input[type="submit"]:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            button.secondary {
                background: #64748b;
            }

            button.danger {
                background: #dc2626;
            }

            #todo-list {
                list-style: none;
                padding: 0;
                margin: 0;
            }

            #todo-list li {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                padding: 0.75rem;
                border: 1px solid #e5e7eb;
                border-radius: 4px;
                margin-bottom: 0.5rem;
            }

            #todo-list li span {
                flex: 1;
            }

            #todo-list li.editing span {
                display: none;
            }

            #todo-list li.editing input.edit-input {
                flex: 1;
                padding: 0.35rem 0.5rem;
                border: 1px solid #2563eb;
                border-radius: 4px;
            }

            .empty-message {
                color: #64748b;
                text-align: center;
                padding: 1rem;
            }
        </style>
        <script src=".js"></script>
    </head>
    <body>
        <h1>To-Do List</h1>

        <input id="search" type="text" placeholder="Search tasks...">

        <form id="add-form" class="controls">
            <input id="task-input" placeholder="New task" type="text" autocomplete="off">
            <input id="submit" type="submit" value="Add">
        </form>

        <ul id="todo-list"></ul>
        <p id="empty-message" class="empty-message" hidden>No tasks found.</p>
    </body>
</html>
